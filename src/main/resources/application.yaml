spring:
  application:
    name: SalesWIthAgent
  datasource:
    url: jdbc:mysql://localhost:3306/saleswithagent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms

      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms


  ai:
    deepseek:
      api-key: "${DEEPSEEK_API_KEY}"
      base-url: "${DEEPSEEK_BASE_URL:https://api.deepseek.com}"
      chat:
        model: "${DEEPSEEK_MODEL:deepseek-chat}"

        max-tokens: 2048
        temperature: 0.2



app:
  jwt:
    secret: "${JWT_SECRET:vIug98JVSsiSnLWva30E4rpzvziBYqJV20LsXUtofws=}"
    ttl-seconds: 7200000
